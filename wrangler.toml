# Cloudflare Pages config. Bindings here override the dashboard settings.
# Secrets (EXPORT_TOKEN) are NOT stored here: set them in the dashboard or with
# `npx wrangler pages secret put EXPORT_TOKEN --project-name svk-meetup`.
name = "svk-meetup"
pages_build_output_dir = "."
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "svk-meetup"
database_id = "4e864fc5-bf47-43f1-b1f9-db33a93f50e3"
migrations_dir = "migrations"
